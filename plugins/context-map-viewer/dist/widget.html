<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="context-map-viewer-transport" content="mcp">
    <title>Context Map Viewer</title>
    <style>:root {
  color-scheme: light dark;
  font-family: ui-sans-serif, system-ui, sans-serif;
  --surface: #f7f8fb;
  --panel: rgba(255, 255, 255, 0.92);
  --text: #172033;
  --muted: #697386;
  --line: #a7b0c2;
  --border: #dce1eb;
  --accent: #667eea;
}

body {
  margin: 0;
  overflow: hidden;
  color: var(--text);
  background: var(--surface);
}

#app {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  min-height: 280px;
}

.toolbar {
  z-index: 2;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 8px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(10px);
}

.search {
  display: flex;
  flex: 1 1 180px;
  align-items: center;
  gap: 6px;
  min-width: 100px;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.search input {
  width: 100%;
  min-width: 0;
  padding: 7px 0;
  border: 0;
  outline: 0;
  color: inherit;
  background: transparent;
}

.toolbar-group {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
}

.view-modes {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 3px;
}

.view-modes [aria-checked="true"] {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, var(--panel));
}

button {
  min-height: 32px;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  color: inherit;
  background: var(--panel);
  cursor: pointer;
}

button:hover,
button:focus-visible {
  border-color: var(--accent);
}

#zoom-value {
  width: 42px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.sync-status {
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}

.sync-status::before {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 5px;
  border-radius: 50%;
  background: #e0a13b;
  content: "";
}

.sync-status.synced::before {
  background: #3aa675;
}

.sync-status.error::before {
  background: #d45a62;
}

.stage {
  position: relative;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
  background-color: var(--surface);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--line) 35%, transparent) 1px, transparent 1px);
  background-size: 18px 18px;
}

.stage[data-mode="tree"] { grid-template-columns: minmax(0, 1fr); }
.stage[data-mode="map"] { grid-template-columns: minmax(0, 1fr); }
.stage[data-mode="tree"] .map-pane,
.stage[data-mode="map"] .tree-pane { display: none; }

.tree-pane {
  min-width: 0;
  overflow: auto;
  border-right: 1px solid var(--border);
  background: var(--panel);
}

.tree-root {
  padding: 6px;
}

.tree-item {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr);
  align-items: center;
  width: 100%;
}

.tree-disclosure,
.tree-label {
  min-width: 0;
  border-color: transparent;
  background: transparent;
}

.tree-disclosure {
  padding: 5px;
}

.tree-label {
  padding-left: calc(8px + var(--tree-depth) * 14px);
  overflow: hidden;
  text-align: left;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tree-item[aria-selected="true"],
.map-node.selected rect {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.map-pane {
  position: relative;
  min-width: 0;
  min-height: 0;
}

#canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
  user-select: none;
}

#canvas.dragging {
  cursor: grabbing;
}

.link {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.5;
}

.map-node {
  cursor: pointer;
  transition: opacity 120ms ease;
}

.map-node rect {
  fill: var(--panel);
  stroke: var(--border);
  stroke-width: 1.25;
}

.map-node text {
  fill: var(--text);
  font-size: 13px;
  pointer-events: none;
}

.map-node.root rect {
  fill: #667eea;
  stroke: #5266cc;
}

.map-node.root text {
  fill: #fff;
  font-weight: 700;
}

.map-node.section-goal rect,
.map-node.section-status rect {
  fill: #eef1ff;
  stroke: #8692e8;
}

.map-node.section-tasks rect {
  fill: #edf8f2;
  stroke: #70b38e;
}

.map-node.section-decisions rect {
  fill: #fff4df;
  stroke: #d4a65a;
}

.map-node.section-questions rect {
  fill: #f4efff;
  stroke: #9b80d1;
}

.map-node.section-risks rect,
.map-node.risk-high rect {
  fill: #fff0f0;
  stroke: #d66f76;
}

.map-node.section-excluded rect,
.map-node.excluded rect {
  fill: #f0f1f4;
  stroke-dasharray: 4 3;
}

.map-node.done {
  opacity: 0.65;
}

.map-node.match rect {
  stroke: var(--accent);
  stroke-width: 3;
}

.map-node.dim {
  opacity: 0.22;
}

.fold-badge {
  fill: var(--accent);
}

.fold-badge-text {
  fill: #fff !important;
  font-size: 10px !important;
  font-weight: 700;
}

.empty-state {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  padding: 32px;
  color: var(--muted);
  text-align: center;
}

.empty-state[hidden] {
  display: none;
}

@media (max-width: 559px) {
  .search { flex-basis: 100%; }
}

@media (max-width: 559px) and (min-width: 420px) {
  .stage[data-mode="split"] { grid-template-columns: 180px minmax(0, 1fr); }
}

@media (max-width: 419px) {
  .stage[data-mode="split"] {
    grid-template-columns: 1fr;
    grid-template-rows: 40% 60%;
  }
  .stage[data-mode="split"] .tree-pane {
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #161922;
    --panel: rgba(35, 39, 51, 0.94);
    --text: #edf0f7;
    --muted: #a5adbd;
    --line: #596174;
    --border: #414858;
  }

  .map-node.section-goal rect,
  .map-node.section-status rect,
  .map-node.section-tasks rect,
  .map-node.section-decisions rect,
  .map-node.section-questions rect,
  .map-node.section-risks rect,
  .map-node.section-excluded rect,
  .map-node.risk-high rect,
  .map-node.excluded rect {
    fill: var(--panel);
  }
}
</style>
  </head>
  <body>
    <main id="app">
      <header class="toolbar" aria-label="Context Map controls">
        <label class="search">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search nodes" autocomplete="off">
        </label>
        <div id="view-modes" class="view-modes" role="radiogroup" aria-label="View mode">
          <button id="mode-tree" type="button" role="radio" aria-checked="false" data-mode="tree">Tree</button>
          <button id="mode-map" type="button" role="radio" aria-checked="false" data-mode="map">Map</button>
          <button id="mode-split" type="button" role="radio" aria-checked="true" data-mode="split">Both</button>
        </div>
        <div class="toolbar-group">
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <output id="zoom-value" aria-live="polite">100%</output>
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="fit" type="button">Fit</button>
          <button id="expand" type="button">Expand</button>
          <button id="collapse" type="button">Collapse</button>
        </div>
        <div id="sync-status" class="sync-status" role="status">Refreshing</div>
      </header>
      <section id="stage" class="stage" data-mode="split">
        <div id="tree-pane" class="tree-pane">
          <div id="tree-root" class="tree-root" role="tree" aria-label="Context Map tree"></div>
        </div>
        <section id="map-pane" class="map-pane" aria-label="Context Map canvas">
          <svg id="canvas" role="img" aria-label="Handoff Context Map">
            <g id="viewport">
              <g id="links"></g>
              <g id="nodes"></g>
            </g>
          </svg>
        </section>
        <aside id="details-drawer" class="details-drawer" aria-labelledby="details-title" hidden>
          <button id="details-close" type="button" aria-label="Close node details">×</button>
          <h2 id="details-title" tabindex="-1">Node details</h2>
          <div id="details-path" class="details-path"></div>
          <p id="details-text" class="details-text"></p>
          <dl id="details-meta" class="details-meta"></dl>
        </aside>
        <div id="empty-state" class="empty-state" hidden></div>
      </section>
    </main>
