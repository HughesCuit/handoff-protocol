name: Skills CLI discovery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Skills CLI discovers the handoff skill
        run: npm run test:skills
